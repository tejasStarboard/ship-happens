services:
  postgres-service:
    image: postgres:16-alpine
    container_name: ship-happens-postgres
    restart: unless-stopped
    ports:
      - "54325:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ship_happens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ship_happens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-service:
    image: redis:7-alpine
    container_name: ship-happens-redis
    restart: unless-stopped
    ports:
      - "63799:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
