name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stub env so apps/web can typecheck/build/e2e without real secrets
  POSTGRES_SSL: "false"
  REDIS_URL: redis://127.0.0.1:6379
  BETTER_AUTH_SECRET: ci-better-auth-secret-min-32-characters-long
  BETTER_AUTH_DOMAIN: localhost
  APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  RESEND_API_KEY: re_ci_placeholder
  EMAIL_SENDER_NAME: Ship Happens CI
  EMAIL_SENDER_ADDRESS: noreply@example.com
  BLOB_STORE_ID: local
  BLOB_READ_WRITE_TOKEN: vercel_blob_local_placeholder
  JEV_API_KEY: jev_ci_placeholder
  MICROSOFT_CLIENT_ID: ""
  MICROSOFT_CLIENT_SECRET: ""
  OUTLOOK_WEBHOOK_CLIENT_STATE: ship-happens-ci
  GMAIL_PUBSUB_TOPIC: ""
  GMAIL_PUBSUB_VERIFICATION_TOKEN: ""
  # Turbo local cache dir (also restored via actions/cache)
  TURBO_CACHE_DIR: .turbo

jobs:
  ci:
    name: format · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{js,jsx,ts,tsx}', 'packages/**/src/**/*.{js,jsx,ts,tsx}', 'packages/**/tsup.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ship_happens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ship_happens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ship_happens
      CI: "true"
      # Playwright webServer only starts; build runs in a dedicated step below.
      PLAYWRIGHT_SKIP_WEBSERVER_BUILD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{js,jsx,ts,tsx}', 'packages/**/src/**/*.{js,jsx,ts,tsx}', 'packages/**/tsup.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      # Browser binaries only — OS/apt packages are not cached. Key includes the
      # Playwright version so lock bumps invalidate the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-1.63.0-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache hit still needs OS libs every run (fresh VM). `install-deps` can
      # hang on apt; bound it, kill orphaned apt after timeout (otherwise the
      # fallback races on /var/lib/dpkg/lock-frontend), then retry install-deps.
      - name: Install Playwright Chromium + OS deps
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          release_apt_lock() {
            sudo killall -9 apt-get apt dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 \
                && ! sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          }

          pnpm --filter web exec playwright install chromium

          # -k: SIGKILL after grace so grandchild apt-get does not keep the lock
          if ! timeout -k 20s 150s pnpm --filter web exec playwright install-deps chromium; then
            echo "::warning::playwright install-deps timed out or failed; clearing apt lock and retrying"
            release_apt_lock
            timeout -k 20s 300s pnpm --filter web exec playwright install-deps chromium
          fi

      - name: Build web + workspace deps
        # Builds @ship-happens/db, @ship-happens/fill, @ship-happens/sb-client, then web
        run: pnpm exec turbo build --filter=web...

      - name: Push database schema
        run: pnpm db:push

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
